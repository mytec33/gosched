name: Go CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04, windows-2022, windows-2025]

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./...

      - name: Test with race detection
        run: go test -race -count=1 -v ./...

      - name: Vet
        run: go vet ./...

      - name: Install analysis tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install github.com/kisielk/errcheck@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Staticcheck
        run: staticcheck ./...

      - name: Errcheck
        run: errcheck ./...

      - name: Vulnerability check
        run: govulncheck ./...        
